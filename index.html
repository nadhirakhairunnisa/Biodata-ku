
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Pribadi - Bento Grid</title>
    <!-- Menggunakan Google Fonts Montserrat dan Font Awesome untuk Ikon -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* --- CSS VARIABLES (Tema Warna Ungu & Peach) --- */
        :root {
            --bg-main: #fcf6f5;
            --bg-grid: #ffffff;
            --color-text-main: #2d2335;
            --color-text-muted: #6b5b75;
            --purple-light: #e8dbfc;
            --purple-accent: #9b72cf;
            --peach-light: #ffe5d9;
            --peach-accent: #ff9a76;
            --card-shadow: 0 10px 30px rgba(155, 114, 207, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --radius: 24px;
        }

        /* --- DARK MODE VARIABLES --- */
        [data-theme="dark"] {
            --bg-main: #130f1a;
            --bg-grid: #1e1826;
            --color-text-main: #f5efff;
            --color-text-muted: #bdaec6;
            --purple-light: #342548;
            --purple-accent: #b388eb;
            --peach-light: #422a27;
            --peach-accent: #ffb399;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* --- BASE STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-main);
            color: var(--color-text-main);
            transition: var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* --- FLOATING CONTROLS --- */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .theme-toggle {
            background: var(--bg-grid);
            border: 2px solid var(--purple-light);
            color: var(--purple-accent);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            font-size: 1.2rem;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: var(--purple-light);
        }

        /* --- BENTO GRID CONTAINER --- */
        .bento-container {
            display: grid;
            width: 100%;
            max-width: 1100px;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(160px, auto);
            gap: 24px;
        }

        /* --- CARD GENERIC STYLE --- */
        .bento-card {
            background-color: var(--bg-grid);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .bento-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(155, 114, 207, 0.15);
        }

        /* --- SPECIFIC CARD LAYOUTS --- */
        /* 1. Hero Identity */
        .card-hero {
            grid-column: span 2;
            grid-row: span 2;
            flex-direction: row;
            align-items: center;
            gap: 25px;
            background: linear-gradient(135deg, var(--purple-light) 0%, var(--peach-light) 100%);
        }

        .hero-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-grid);
            box-shadow: var(--card-shadow);
        }

        .hero-info h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background-color: var(--bg-grid);
            color: var(--purple-accent);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
        }

        /* 2. About Me */
        .card-about {
            grid-column: span 2;
            justify-content: flex-start;
        }

        .card-about h3 {
            margin-bottom: 12px;
            color: var(--purple-accent);
        }

        .card-about p {
            color: var(--color-text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* 3. Social Media */
        .card-social {
            grid-column: span 1;
            align-items: center;
            justify-content: space-around;
            flex-direction: row;
            gap: 10px;
        }

        .social-icon {
            font-size: 1.5rem;
            color: var(--color-text-muted);
            transition: var(--transition);
            text-decoration: none;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-main);
        }

        .social-icon:hover {
            color: white;
            transform: scale(1.15);
        }

        .icon-li:hover { background-color: #0077b5; }
        .icon-gh:hover { background-color: #333; }
        .icon-ig:hover { background-color: #e1306c; }

        /* 4. Skills Dashboard */
        .card-skills {
            grid-column: span 1;
            grid-row: span 2;
            justify-content: flex-start;
        }

        .card-skills h3 {
            margin-bottom: 20px;
            color: var(--peach-accent);
        }

        .skill-item {
            margin-bottom: 15px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .skill-bar {
            height: 8px;
            background-color: var(--bg-main);
            border-radius: 4px;
            overflow: hidden;
        }

        .skill-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--purple-accent), var(--peach-accent));
            border-radius: 4px;
            width: 0; /* Dianimasikan via JS */
            transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        /* 5. Featured Project */
        .card-project {
            grid-column: span 2;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.4)), url('https://unsplash.com') center/cover;
            color: white;
            justify-content: flex-end;
            min-height: 200px;
        }

        [data-theme="dark"] .card-project {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), url('https://unsplash.com') center/cover;
        }

        .card-project h3 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .card-project p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* 6. Lifestyle / Spotify */
        .card-lifestyle {
            grid-column: span 1;
            background-color: var(--peach-light);
            border: 2px dashed var(--peach-accent);
        }

        .lifestyle-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lifestyle-content i {
            font-size: 2rem;
            color: var(--peach-accent);
        }

        .lifestyle-text p {
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .lifestyle-text h4 {
            font-size: 1rem;
        }

        /* 7. Contact CTA */
        .card-contact {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, var(--peach-light) 0%, var(--purple-light) 100%);
        }

        .contact-text h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .contact-btn {
            background-color: var(--bg-grid);
            color: var(--color-text-main);
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-btn:hover {
            background-color: var(--purple-accent);
            color: white;
            transform: scale(1.05);
        }

        /* --- RESPONSIVE BREAKPOINTS (UX HP & Tablet) --- */
        @media (max-width: 900px) {
            .bento-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .card-hero, .card-about, .card-project, .card-contact {
                grid-column: span 2;
            }
            .card-skills {
                grid-column: span 2;
                grid-row: span 1;
            }
            .card-social, .card-lifestyle {
                grid-column: span 1;
            }
        }

        @media (max-width: 550px) {
            .bento-container {
